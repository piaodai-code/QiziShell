<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none';">
  <title>历史消息</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="history-window">
  <div class="app history-app">
    <div class="history-search-row" id="history-search-row">
      <label class="history-search-field" for="history-search-input">
        <img src="assets/icons/history-inline.png" alt="" aria-hidden="true">
        <input id="history-search-input" type="text" placeholder="搜索历史消息">
      </label>
      <span class="history-search-count" id="history-search-count">0/0</span>
      <button type="button" class="history-search-btn history-search-btn-icon" id="history-search-prev" title="上一条" aria-label="上一条">
        <img src="assets/icons/history-search-up.png" alt="" aria-hidden="true">
      </button>
      <button type="button" class="history-search-btn history-search-btn-icon" id="history-search-next" title="下一条" aria-label="下一条">
        <img src="assets/icons/history-search-down.png" alt="" aria-hidden="true">
      </button>
      <button type="button" class="history-search-btn" id="history-search-clear" title="清除搜索" aria-label="清除搜索">✕</button>
    </div>
    <div class="history-status" id="history-status" hidden></div>
    <section class="chat-screen history-chat-screen">
      <main class="messages" id="messages">
        <div class="msg-hint">加载中…</div>
      </main>
    </section>
    <div class="history-multiselect" id="history-multiselect" hidden>
      <span class="composer-multiselect-hint" id="history-multiselect-hint">请选择消息</span>
      <div class="composer-multiselect-actions">
        <button type="button" class="multiselect-btn" id="history-multiselect-cancel">取消</button>
        <button type="button" class="multiselect-btn" id="history-multiselect-export" disabled>保存</button>
        <button type="button" class="multiselect-btn multiselect-btn-primary" id="history-multiselect-send" disabled>发送</button>
      </div>
    </div>
  </div>
  <div class="msg-context-menu" id="msg-context-menu" hidden role="menu">
    <button type="button" class="msg-context-item" data-action="copy" role="menuitem">
      <img src="assets/icons/copy.png" alt="" class="msg-context-icon" aria-hidden="true">
      <span>复制</span>
    </button>
    <button type="button" class="msg-context-item" data-action="quote" role="menuitem">
      <img src="assets/icons/quotation.png" alt="" class="msg-context-icon" aria-hidden="true">
      <span>引用</span>
    </button>
    <button type="button" class="msg-context-item" data-action="forward" role="menuitem">
      <img src="assets/icons/forward.png" alt="" class="msg-context-icon" aria-hidden="true">
      <span>转发</span>
    </button>
    <button type="button" class="msg-context-item" data-action="multiselect" role="menuitem">
      <img src="assets/icons/selection.png" alt="" class="msg-context-icon" aria-hidden="true">
      <span>多选</span>
    </button>
    <button type="button" class="msg-context-item" data-action="export" role="menuitem">
      <img src="assets/icons/word.png" alt="" class="msg-context-icon" aria-hidden="true">
      <span>保存</span>
    </button>
    <button type="button" class="msg-context-item msg-context-item-divided" data-action="copy-edit" role="menuitem">
      <svg class="msg-context-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
        <path fill="currentColor" d="M2.2 11.7 11.3 2.6a1.2 1.2 0 0 1 1.7 0l.4.4a1.2 1.2 0 0 1 0 1.7l-9.1 9.1-2.7.6.6-2.7Z"/>
      </svg>
      <span>文案编辑</span>
    </button>
    <button type="button" class="msg-context-item msg-context-item-meeting" data-action="start-meeting" role="menuitem">
      <img src="assets/icons/meeting-menu.png" alt="" class="msg-context-icon msg-context-icon-meeting" aria-hidden="true">
      <span>发起会议</span>
    </button>
  </div>
  <script src="dompurify.min.js"></script>
  <script src="marked.min.js"></script>
  <script src="message-time.js"></script>
  <script src="code-block.js"></script>
  <script src="message-view.js"></script>
  <script src="history.js"></script>
</body>
</html>
